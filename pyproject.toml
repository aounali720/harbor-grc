[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "harbor-grc"
version = "1.1.2"
description = "A practical single-organization GRC workspace for SaaS, cloud assurance, and vendor risk"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "fastapi>=0.162.0,<0.163",
  "uvicorn>=0.54.0,<0.55",
  "pydantic>=2.14.1,<2.15",
]

[project.scripts]
harbor-grc = "harbor_grc.__main__:main"

[tool.setuptools.packages.find]
include = ["harbor_grc*"]

[tool.setuptools.package-data]
harbor_grc = ["static/*", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py311"
exclude = ["data"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

